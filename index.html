<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>رَصْد — v4.0</title>
<style>
:root{--primary:#0f766e;--navy:#17324d;--bg:#f5f8fb;--card:#fff;--muted:#6b7280;--danger:#b91c1c;--border:#dbe4ea}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:#14213d}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.hidden{display:none!important} .app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:82px}
header{position:sticky;top:0;z-index:10;background:#ffffffee;backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px}
header img{width:44px;height:44px;border-radius:12px} header h1{font-size:20px;margin:0} header small{color:var(--muted)}
main{padding:16px} .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;box-shadow:0 4px 14px #0f172a0d}
.class-card{min-height:140px;display:flex;flex-direction:column;justify-content:space-between} .class-title{font-size:22px;font-weight:800}
.muted{color:var(--muted)} .btn{border:0;border-radius:14px;padding:12px 16px;background:var(--primary);color:#fff;font-weight:700}
.btn.secondary{background:#e7f4f2;color:#0f615b} .btn.danger{background:#fee2e2;color:#991b1b} .btn.light{background:#fff;color:#17324d;border:1px solid var(--border)}
.fab{position:fixed;left:18px;bottom:88px;width:58px;height:58px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:32px;box-shadow:0 10px 25px #0f766e55}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav button{border:0;background:none;padding:6px 2px;color:#64748b;font-size:12px} nav button.active{color:var(--primary);font-weight:800}
nav span{display:block;font-size:22px;margin-bottom:2px}
.modal{position:fixed;inset:0;background:#0007;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(700px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px}
.field{margin:12px 0} label{display:block;font-weight:700;margin-bottom:6px} input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:#fff}
.row{display:flex;gap:10px;align-items:center} .row>*{flex:1}
.student{display:flex;align-items:center;gap:12px;margin-bottom:10px} .avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#e2e8f0}
.student-info{flex:1} .student-name{font-weight:800;font-size:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap} .chip{padding:8px 10px;border-radius:999px;border:1px solid var(--border);background:#fff}
.beh-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px} .beh{border:1px solid var(--border);border-radius:14px;padding:10px;text-align:right;background:#fff}
.beh .points{font-weight:800;color:var(--primary)} .negative .points{color:var(--danger)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden} th,td{border-bottom:1px solid var(--border);padding:10px;text-align:center} th{background:#edf7f6} td:first-child,th:first-child{text-align:right}
.score{width:76px!important;text-align:center} .wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.wheel{width:min(82vw,360px);aspect-ratio:1;border-radius:50%;border:10px solid #fff;box-shadow:0 8px 25px #0f172a24;display:flex;align-items:center;justify-content:center;background:conic-gradient(#0f766e 0 45deg,#2563eb 45deg 90deg,#f59e0b 90deg 135deg,#7c3aed 135deg 180deg,#10b981 180deg 225deg,#ef4444 225deg 270deg,#0284c7 270deg 315deg,#84cc16 315deg 360deg);transition:transform 3.4s cubic-bezier(.15,.8,.1,1)}
.wheel-inner{width:58%;height:58%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:24px;font-weight:900;color:var(--navy)}
.notice{background:#ecfeff;border:1px solid #a5f3fc;padding:12px;border-radius:14px} .report{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px}
.splash{position:fixed;inset:0;background:white;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.splash img{width:180px;height:180px;border-radius:32px} .splash h2{font-size:34px;margin:0;color:var(--navy)} .splash p{color:var(--primary);font-weight:700}

.home-hero{background:linear-gradient(135deg,#17324d,#0f766e);color:#fff;border:0}
.home-hero h2{margin:0 0 8px}.home-hero .btn{background:#fff;color:#17324d}
.metric{background:#fff;border:1px solid var(--border);border-radius:16px;padding:12px}
.metric b{display:block;font-size:24px;margin-top:5px}
.schedule-wrap{overflow:auto}.schedule-table{min-width:780px}.schedule-table select{min-width:115px;padding:8px}
.session-head{position:sticky;top:0;z-index:12;background:#fff;border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:10px}
.session-student{position:relative;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.status-pill{padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#dcfce7;color:#166534}
.status-pill.absent{background:#e5e7eb;color:#475569}.status-pill.late{background:#fef3c7;color:#92400e}
.toast{position:fixed;left:14px;right:14px;bottom:92px;z-index:90;background:#172033;color:#fff;padding:12px;border-radius:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.toast button{padding:7px 11px}
.focus-mode header,.focus-mode nav,.focus-mode .fab{display:none!important}.focus-mode .app{padding-bottom:0}.focus-mode main{padding-top:10px}


.class-color{width:14px;height:14px;border-radius:50%;display:inline-block;margin-left:6px;vertical-align:middle}
.student-grid{display:grid;grid-template-columns:1fr;gap:10px}
.student-card-rich{display:flex;align-items:center;gap:12px}
.student-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:7px;font-size:12px;color:var(--muted)}
.student-meta span{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:6px 8px}
.searchbar{position:sticky;top:70px;z-index:8;background:var(--bg);padding-bottom:10px}
.searchbar input{width:100%;padding:12px;border:1px solid var(--border);border-radius:13px;background:#fff}
.color-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.color-choice{height:34px;border-radius:10px;border:3px solid transparent}
.color-choice.active{border-color:#111827}


.photo-picker{display:flex;align-items:center;gap:12px;padding:10px;border:1px dashed var(--border);border-radius:14px;background:#f8fafc}
.photo-preview{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#e5e7eb;border:1px solid var(--border)}
.photo-preview-letter{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#dff3ef;color:#0f766e;font-size:30px;font-weight:900}
.photo-status{font-size:13px;color:var(--muted);margin-top:5px}


.quick-eval-section{margin:14px 0}
.quick-eval-title{font-weight:900;margin-bottom:8px}
.quick-options{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.quick-options.three{grid-template-columns:repeat(3,1fr)}
.quick-options.four{grid-template-columns:repeat(4,1fr)}
.quick-option{border:1px solid var(--border);background:#fff;border-radius:13px;padding:11px 6px;text-align:center;font-weight:800}
.quick-option.selected{background:#dff3ef;border-color:#0f766e;color:#0f766e}
.quick-option .icon{display:block;font-size:24px;margin-bottom:4px}
.eval-summary{background:#f8fafc;border:1px solid var(--border);border-radius:13px;padding:10px;margin-top:12px}


.avatar-letter{
 width:72px;height:72px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#dff3ef,#c7e8e3);
 color:#0f766e;font-weight:900;font-size:30px;
 border:1px solid var(--border);flex:0 0 72px
}
.avatar-image{
 width:72px;height:72px;border-radius:50%;object-fit:cover;
 border:2px solid #fff;box-shadow:0 4px 12px #0002;flex:0 0 72px
}
.version-badge{
 display:inline-flex;align-items:center;gap:6px;
 padding:6px 10px;border-radius:999px;background:#e7f4f2;
 color:#0f766e;font-weight:800;font-size:12px
}
.student-card-rich{padding:16px}
.student-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}


.session-toolbar{
 display:flex;align-items:center;gap:10px;justify-content:space-between;
 background:#fff;border:1px solid var(--border);border-radius:16px;
 padding:12px;margin-bottom:10px;position:sticky;top:0;z-index:12
}
.session-stats{
 display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0
}
.session-stat{
 background:#fff;border:1px solid var(--border);border-radius:14px;
 padding:10px;text-align:center
}
.session-stat b{display:block;font-size:22px;margin-top:4px}
.session-card{
 display:flex;align-items:center;gap:12px;padding:14px;
 background:#fff;border:1px solid var(--border);border-radius:18px;
 margin-bottom:10px;transition:.2s ease
}
.session-card.absent{opacity:.65;background:#f1f5f9}
.session-card.late{background:#fff7ed}
.session-card.present{background:#fff}
.session-name{font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-actions{display:flex;gap:8px;align-items:center}
.session-status-btn{
 min-width:82px;border:0;border-radius:999px;padding:8px 10px;font-weight:900
}
.session-status-btn.present{background:#dcfce7;color:#166534}
.session-status-btn.late{background:#fef3c7;color:#92400e}
.session-status-btn.absent{background:#e5e7eb;color:#475569}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.summary-item{background:#f8fafc;border:1px solid var(--border);border-radius:14px;padding:12px}
.summary-item b{display:block;font-size:24px;margin-top:4px}
.summary-highlight{background:linear-gradient(135deg,#17324d,#0f766e);color:#fff;border:0}


.icon3d{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 10px #0001;border:1px solid #ffffffaa}
.icon3d.green{background:linear-gradient(145deg,#e3f8ec,#c6f0d8)}
.icon3d.amber{background:linear-gradient(145deg,#fff4d8,#ffe0a3)}
.icon3d.red{background:linear-gradient(145deg,#ffe4e4,#ffcaca)}
.student-compact{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border:1px solid var(--border);border-radius:17px;margin-bottom:9px;box-shadow:0 5px 18px #17324d0d}
.student-compact-main{flex:1;min-width:0}
.student-compact-top{display:flex;align-items:center;gap:7px}
.student-level{font-size:10px;font-weight:900;border-radius:999px;padding:4px 7px}
.student-level.excellent{background:#dcfce7;color:#166534}
.student-level.good{background:#e0f2fe;color:#075985}
.student-level.follow{background:#fef3c7;color:#92400e}
.student-mini-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:7px}
.student-mini-stat{display:flex;align-items:center;justify-content:center;gap:3px;background:#f8fafc;border:1px solid var(--border);border-radius:9px;padding:5px 3px;font-size:11px}
.student-card-actions{display:flex;flex-direction:column;gap:6px}
.eval-btn{border:0;border-radius:11px;padding:8px 9px;background:#e7f4f2;color:#0f766e;font-weight:900}
.compact-section{margin:10px 0}
.compact-section-title{font-weight:900;margin-bottom:6px}
.compact-row{display:grid;gap:6px}
.compact-row.five{grid-template-columns:repeat(5,1fr)}
.compact-row.three{grid-template-columns:repeat(3,1fr)}
.compact-row.four{grid-template-columns:repeat(4,1fr)}
.compact-choice{border:1px solid var(--border);border-radius:11px;background:#fff;padding:7px 3px;text-align:center;font-size:11px;font-weight:800}
.compact-choice span{display:block;font-size:20px;margin-bottom:2px}
.compact-choice.selected{background:#e7f4f2;border-color:#0f766e;color:#0f766e}
.note-toggle{width:100%;border:1px dashed var(--border);border-radius:11px;padding:9px;background:#f8fafc;text-align:right;font-weight:800}
.compact-footer{display:flex;align-items:center;gap:7px;margin-top:10px}
.compact-total{flex:1;background:#f8fafc;border:1px solid var(--border);border-radius:11px;padding:9px}


/* ===== شاشة الطلاب v0.7.1 ===== */
.students-page-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:12px
}
.students-count{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 11px;border-radius:999px;
  background:#e8f6f3;color:#08756c;font-weight:900;font-size:13px
}
.students-actions{
  display:grid;grid-template-columns:1.15fr 1fr;gap:10px;margin-bottom:12px
}
.action-tile{
  border:0;border-radius:18px;padding:12px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-weight:900;min-height:62px
}
.action-tile.primary{
  color:#fff;background:linear-gradient(145deg,#0f8b7f,#087269);
  box-shadow:0 9px 20px #0f766e2e
}
.action-tile.soft{
  color:#0d6f68;background:linear-gradient(145deg,#effbf8,#dcf3ee);
  border:1px solid #cce8e2
}
.rasd-icon{
  width:38px;height:38px;border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:21px;flex:0 0 38px;
  box-shadow:inset 0 1px 0 #fff9,0 5px 12px #13243b16
}
.rasd-icon.green{background:linear-gradient(145deg,#dff8e9,#bfeccf)}
.rasd-icon.blue{background:linear-gradient(145deg,#e8f1ff,#cadcff)}
.rasd-icon.amber{background:linear-gradient(145deg,#fff4d8,#ffe0a0)}
.rasd-icon.red{background:linear-gradient(145deg,#ffe8e8,#ffcaca)}
.rasd-icon.purple{background:linear-gradient(145deg,#f2ebff,#ddceff)}
.students-search{
  position:relative;margin-bottom:12px
}
.students-search input{
  height:54px;padding:12px 48px 12px 14px;
  border-radius:17px;background:#fff;
  box-shadow:0 5px 16px #17324d0b
}
.students-search .search-symbol{
  position:absolute;right:15px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  background:#e9f5f3;color:#0f766e;font-size:16px
}
.student-premium-card{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  gap:12px;align-items:center;background:#fff;
  border:1px solid #dce6ec;border-radius:22px;
  padding:14px;margin-bottom:11px;
  box-shadow:0 8px 24px #17324d0c
}
.student-premium-card .avatar-image,
.student-premium-card .avatar-letter{
  width:68px;height:68px;flex-basis:68px
}
.student-main{min-width:0}
.student-title-row{
  display:flex;align-items:center;gap:7px;margin-bottom:8px;min-width:0
}
.student-title-row .student-name{
  font-size:18px;min-width:0;flex:1
}
.student-level-badge{
  padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900;
  white-space:nowrap
}
.student-level-badge.excellent{background:#dcfce7;color:#166534}
.student-level-badge.good{background:#e0f2fe;color:#075985}
.student-level-badge.follow{background:#fef3c7;color:#92400e}
.student-stats-new{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px
}
.student-stat-new{
  min-width:0;padding:6px 3px;border:1px solid #e1e9ee;
  border-radius:11px;background:#f9fbfc;text-align:center;
  font-size:11px;color:#586678
}
.student-stat-new .mini-icon{
  display:block;font-size:17px;line-height:1;margin-bottom:3px
}
.student-side-actions{
  display:flex;flex-direction:column;gap:7px;align-items:stretch
}
.student-evaluate-btn{
  border:0;border-radius:12px;padding:9px 10px;
  background:linear-gradient(145deg,#e8f7f4,#d3eee9);
  color:#08756c;font-weight:900;min-width:68px
}
.student-menu-btn{
  border:1px solid #dce6ec;border-radius:12px;
  background:#fff;color:#17324d;padding:7px 10px;font-size:18px
}
.empty-students{
  text-align:center;padding:32px 18px;border-radius:20px;
  border:1px dashed #cbd9e1;background:#fff;color:#64748b
}
.empty-students .empty-icon{
  width:66px;height:66px;margin:0 auto 12px;border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  font-size:34px;background:linear-gradient(145deg,#e8f1ff,#d4e2ff)
}

    "avatar main menu"

  padding:0!important;
  background:#f8fafc!important;
  border:1px solid #dce6ec!important;

.student-menu-btn::before{

/* ===== شريط التراجع الذكي v1.7.2 ===== */
.live-undo{
  --undo-bg:#172033;
  --undo-accent:#ffffff;
  background:var(--undo-bg)!important;
  overflow:hidden!important;
}
.live-undo::after{
  content:'';
  position:absolute;
  right:0;
  left:0;
  bottom:0;
  height:3px;
  background:var(--undo-accent);
  transform-origin:right center;
  animation:undoCountdown 5s linear forwards;
  opacity:.9;
}
.live-undo.no-countdown::after{display:none}
.live-undo.type-participation{--undo-bg:#6d28d9;--undo-accent:#ddd6fe}
.live-undo.type-task{--undo-bg:#1d4ed8;--undo-accent:#bfdbfe}
.live-undo.type-excellent{--undo-bg:#15803d;--undo-accent:#bbf7d0}
.live-undo.type-late,.live-undo.type-warning{--undo-bg:#b45309;--undo-accent:#fde68a}
.live-undo.type-absent,.live-undo.type-violation{--undo-bg:#b91c1c;--undo-accent:#fecaca}
.live-undo.success{
  --undo-bg:#0f766e;
  --undo-accent:#99f6e4;
}
.live-undo button{
  transition:transform .15s ease,background .15s ease!important;
}
.live-undo button:active{
  transform:scale(.95);
}
@keyframes undoCountdown{
  from{transform:scaleX(1)}
  to{transform:scaleX(0)}
}
.live-student-card.event-participation{animation:eventParticipation .48s ease}
.live-student-card.event-task{animation:eventTask .48s ease}
.live-student-card.event-excellent{animation:eventExcellent .48s ease}
.live-student-card.event-warning,
.live-student-card.event-late{animation:eventWarning .48s ease}
.live-student-card.event-absent,
.live-student-card.event-violation{animation:eventDanger .48s ease}
@keyframes eventParticipation{
  0%,100%{box-shadow:0 5px 16px #17324d0b}
  50%{box-shadow:0 0 0 6px #7c3aed33}
}
@keyframes eventTask{
  0%,100%{box-shadow:0 5px 16px #17324d0b}
  50%{box-shadow:0 0 0 6px #2563eb33}
}
@keyframes eventExcellent{
  0%,100%{box-shadow:0 5px 16px #17324d0b}
  50%{box-shadow:0 0 0 6px #16a34a33}
}
@keyframes eventWarning{
  0%,100%{box-shadow:0 5px 16px #17324d0b}
  50%{box-shadow:0 0 0 6px #d9770633}
}
@keyframes eventDanger{
  0%,100%{box-shadow:0 5px 16px #17324d0b}
  50%{box-shadow:0 0 0 6px #dc262633}
}

.picked-student{font-size:25px;font-weight:950;color:#17324d;margin:8px 0}
.picker-placeholder{color:#7b8795}
.play-controls,.play-result-controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.play-next{width:100%;margin-top:auto}
.activity-summary{text-align:center;background:linear-gradient(135deg,#17324d,#0f766e);color:#fff;border-radius:24px;padding:24px}
.activity-summary h2{font-size:28px;margin:0 0 10px}
.summary-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.summary-stat{background:#ffffff18;border-radius:14px;padding:12px}
.summary-stat b{display:block;font-size:22px;margin-top:4px}
@media(max-width:520px){.play-options{grid-template-columns:1fr}.activity-tools{grid-template-columns:1fr 1fr}.activity-card-actions{grid-template-columns:1fr auto auto}}

  return false;

async function compressImage(file,maxSize=360,quality=.68){
 if(!file)return '';
 const readAsDataURL=()=>new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error('تعذر قراءة الصورة'));
  reader.onload=()=>resolve(reader.result);
  reader.readAsDataURL(file);
 });
 const source=await readAsDataURL();
 let drawable=null;
 try{
  if('createImageBitmap' in window){
   drawable=await createImageBitmap(file);
  }
 }catch(e){}
 if(!drawable){
  drawable=await new Promise((resolve,reject)=>{
   const img=new Image();
   img.onload=()=>resolve(img);
   img.onerror=()=>reject(new Error('صيغة الصورة غير مدعومة'));
   img.src=source;
  });
 }
 const originalWidth=drawable.width||drawable.naturalWidth;
 const originalHeight=drawable.height||drawable.naturalHeight;
 if(!originalWidth||!originalHeight)throw new Error('تعذر تحديد أبعاد الصورة');
 const scale=Math.min(1,maxSize/Math.max(originalWidth,originalHeight));
 const width=Math.max(1,Math.round(originalWidth*scale));
 const height=Math.max(1,Math.round(originalHeight*scale));
 const canvas=document.createElement('canvas');
 canvas.width=width;canvas.height=height;
 const ctx=canvas.getContext('2d');
 ctx.drawImage(drawable,0,0,width,height);
 if(drawable.close)drawable.close();
 return canvas.toDataURL('image/jpeg',quality);
}

const view=document.getElementById('view'), modal=document.getElementById('modal'), body=document.getElementById('modalBody');
let page='home';
function cls(){return data.classes.find(c=>c.id===data.selectedClass)}
function students(){return data.students.filter(s=>s.classId===data.selectedClass).sort((a,b)=>a.name.localeCompare(b.name,'ar'))}
function setTitle(t,s=''){document.getElementById('pageTitle').textContent=t;document.getElementById('pageSub').textContent=s}
function openModal(html){body.innerHTML=html;modal.classList.remove('hidden')}
function closeModal(){modal.classList.add('hidden')}
function toast(msg,undo){
 document.getElementById('toastText').textContent=msg;
 document.getElementById('toast').classList.remove('hidden');
 lastUndo=undo||null;
 clearTimeout(window.__toastTimer);
 window.__toastTimer=setTimeout(()=>document.getElementById('toast').classList.add('hidden'),5000);
}
document.getElementById('undoBtn').onclick=()=>{if(lastUndo)lastUndo();document.getElementById('toast').classList.add('hidden')};
function todayName(){const map={0:'الأحد',1:'الاثنين',2:'الثلاثاء',3:'الأربعاء',4:'الخميس'};return map[new Date().getDay()]||null}
function minutesNow(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function timeToMinutes(t){if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m}
function currentScheduledSlot(){
 const day=todayName(); if(!day)return null;
 const daySchedule=data.schedule[day]||{};
 const now=minutesNow();
 for(const p of PERIODS){
   const tm=data.periodTimes[p]||{},start=timeToMinutes(tm.start),end=timeToMinutes(tm.end);
   if(daySchedule[p] && start!==null && end!==null && now>=start && now<=end) return {period:p,classId:daySchedule[p],live:true};
 }
 const first=PERIODS.find(p=>daySchedule[p]);
 return first?{period:first,classId:daySchedule[first],live:false}:null;
}
function sessionStatus(studentId){
 return currentSession?.attendance?.[studentId]||'present';
}

}

function buildSessionSummary(session){
 const classList=data.students.filter(s=>s.classId===session.classId);
 const present=classList.filter(s=>(session.attendance?.[s.id]||'present')==='present').length;
 const late=classList.filter(s=>(session.attendance?.[s.id]||'present')==='late').length;
 const absent=classList.filter(s=>(session.attendance?.[s.id]||'present')==='absent').length;
 const sessionLogs=data.logs.filter(l=>l.sessionId===session.id);
 const scoreMap={};
 sessionLogs.forEach(l=>{scoreMap[l.studentId]=(scoreMap[l.studentId]||0)+(l.value||0)});
 let topStudentId=null,topScore=-Infinity;
 Object.entries(scoreMap).forEach(([id,score])=>{if(score>topScore){topScore=score;topStudentId=id}});
 const topStudent=data.students.find(s=>s.id===topStudentId);
 const noteCounts={};
 sessionLogs.filter(l=>l.value<0 || l.note).forEach(l=>{const key=l.note||l.name;noteCounts[key]=(noteCounts[key]||0)+1});
 let commonNote='لا توجد ملاحظات';
 if(Object.keys(noteCounts).length){
   commonNote=Object.entries(noteCounts).sort((a,b)=>b[1]-a[1])[0][0];
 }
 return {present,late,absent,topStudent:topStudent?.name||'لا يوجد',topScore:topScore===-Infinity?0:topScore,commonNote};
}

function animateNumber(element,from,to){
 if(!element)return;
 const start=performance.now();
 const duration=350;
 const step=now=>{
   const p=Math.min(1,(now-start)/duration);
   const value=Math.round(from+(to-from)*p);
   element.textContent=value;
   element.classList.add('live-number-change');
   if(p<1)requestAnimationFrame(step);
   else setTimeout(()=>element.classList.remove('live-number-change'),120);
 };
 requestAnimationFrame(step);
}

     renderCards(orderedList.filter(s=>s.name.includes(q)));
   };

   document.getElementById('endLiveSession').onclick=showLiveSessionSummary;

   const updateTimer=()=>{
     const diff=Math.max(0,Date.now()-startedAt.getTime());
     const min=Math.floor(diff/60000);
     const sec=Math.floor((diff%60000)/1000);
     const el=document.getElementById('liveTimer');
     if(el)el.textContent=`${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;

     const lessonMinutes=45;
     const percent=Math.min(100,(diff/(lessonMinutes*60000))*100);
     const bar=document.getElementById('liveTimeBar');
     if(bar)bar.style.width=`${percent}%`;

     const top=document.querySelector('.live-session-top');
     top?.classList.toggle('time-warn',percent>=88 && percent<97);
     top?.classList.toggle('time-danger',percent>=97);
   };
   updateTimer();
   clearInterval(window.liveTimerInterval);
   window.liveTimerInterval=setInterval(updateTimer,1000);
 };

 const applyLiveAction=(studentId,action)=>{
   ensureStats();
   const student=list.find(s=>s.id===studentId);
   const beforePoints=totalPoints(studentId);
   const beforeAttendance=currentSession.attendance?.[studentId]||'present';
   const beforeStats={...currentSession.liveStats};
   let createdLogId=null;
   let log=null;
   let eventText='';

   currentSession.liveStats.actions++;

   if(action==='participation1'){log={name:'مشاركة 1/5',value:1};eventText=`⭐ تمت إضافة نقطة مشاركة لـ ${student.name}`;}
   if(action==='participation2'){log={name:'مشاركة مميزة',value:2};eventText=`⭐ تمت إضافة مشاركتين مميزتين لـ ${student.name}`;}
   if(action==='task'){log={name:'أنجز المهمة',value:2,task:true};eventText=`📘 تم تسجيل إنجاز مهمة لـ ${student.name}`;}
   if(action==='excellent'){log={name:'سلوك ممتاز',value:2};eventText=`🌟 تم تسجيل سلوك ممتاز لـ ${student.name}`;}
   if(action==='warning'){log={name:'تنبيه سلوكي',value:0};eventText=`⚠️ تم تسجيل تنبيه على ${student.name}`;}
   if(action==='violation'){log={name:'مخالفة سلوكية',value:-1};eventText=`🚫 تم تسجيل مخالفة على ${student.name}`;}

   if(action==='late'||action==='absent'){
     currentSession.attendance=currentSession.attendance||{};
     currentSession.attendance[studentId]=action;
     eventText=action==='late'?`⏰ تم تسجيل تأخر على ${student.name}`:`❌ تم تسجيل غياب على ${student.name}`;
   }else if(log){
     const newLog={
       id:crypto.randomUUID(),
       studentId,
       sessionId:currentSession.id,
       date:new Date().toISOString(),
       ...log
     };
     createdLogId=newLog.id;
     data.logs.push(newLog);
     currentSession.liveStats.pointsAdded+=(log.value||0);
   }

   save();
   const isPositiveAction=['participation1','participation2','task','excellent'].includes(action);
   if(isPositiveAction){
     setTimeout(()=>checkAndUnlockBadges(studentId),120);
     setTimeout(()=>checkLevelUp(studentId),220);
   }

   const afterPoints=totalPoints(studentId);
   const pointsEl=document.querySelector(`[data-points-value="${studentId}"]`);
   animateNumber(pointsEl,beforePoints,afterPoints);

   const card=document.querySelector(`[data-live-card="${studentId}"]`);
   const button=document.querySelector(`[data-live-action="${action}"][data-student-id="${studentId}"]`);

   if(action==='violation'||action==='absent'){
     card?.classList.add('shake');
     setTimeout(()=>card?.classList.remove('shake'),380);
   }else if(action==='late'||action==='warning'){
     card?.classList.add('warn-flash');
     setTimeout(()=>card?.classList.remove('warn-flash'),520);
   }else{
     button?.classList.add('done','success-pulse');
     setTimeout(()=>button?.classList.remove('done','success-pulse'),600);
   }

   const undoType=
     action==='participation1'||action==='participation2'?'participation':
     action==='task'?'task':
     action==='excellent'?'excellent':
     action==='late'?'late':
     action==='warning'?'warning':
     action==='absent'?'absent':
     action==='violation'?'violation':'default';

   showLiveUndo(eventText,()=>{
     if(createdLogId){
       data.logs=data.logs.filter(l=>l.id!==createdLogId);
     }else{
       currentSession.attendance=currentSession.attendance||{};
       currentSession.attendance[studentId]=beforeAttendance;
     }
     currentSession.liveStats={...beforeStats};
     save();
     draw();
   },undoType);

   const eventClass=
     action==='participation1'||action==='participation2'?'participation':action;
   card?.classList.add(`event-${eventClass}`);
   setTimeout(()=>card?.classList.remove(`event-${eventClass}`),520);

   setTimeout(()=>{
     draw();

   },280);
 };

 const averageTasks=total?Math.round(list.reduce((sum,s)=>sum+taskPoints(s.id),0)/total):0;

function rasdIcon(name, size=20){
 const icons={
  play:'<path d="M8 5v14l11-7z"/>',
  group:'<path d="M7 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm10 0a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM1 21v-2c0-3.3 2.7-6 6-6s6 2.7 6 6v2Zm12 0v-2c0-1.8-.6-3.5-1.7-4.8A6 6 0 0 1 17 12c3.3 0 6 2.7 6 6v3Z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  star:'<path d="m12 2 3.1 6.3 7 .9-5 4.9 1.2 6.9L12 17.7 5.7 21l1.2-6.9-5-4.9 7-.9Z"/>',
  task:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  absent:'<circle cx="12" cy="12" r="9"/><path d="m8 8 8 8m0-8-8 8"/>',
  late:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  eval:'<path d="m12 3 2.3 4.7 5.2.8-3.8 3.7.9 5.2-4.6-2.4-4.6 2.4.9-5.2-3.8-3.7 5.2-.8Z"/><path d="M4 21h16"/>',
  more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  dashboard:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="4" rx="1"/><rect x="14" y="11" width="7" height="10" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>'
 };
 return `<svg class="rasd-svg-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.star}</svg>`;
}

 if(!c)return alert('اختر فصلاً أولاً');

 openModal(`<h2>إضافة طلاب جماعيًا</h2>
   <p class="muted">اكتب كل اسم في سطر مستقل. ويمكن أيضًا الفصل بالفاصلة.</p>
   <div class="field">
     <label>أسماء الطلاب</label>
     <textarea id="bulkStudentNames" rows="12" placeholder="محمد أحمد
علي حسن
خالد عبدالله"></textarea>
   </div>
   <div class="notice" id="bulkAddResult" style="display:none"></div>
   <div class="row">
     <button class="btn" id="saveBulkStudents">إضافة الطلاب</button>
     <button class="btn light" id="closeBulkStudents">إلغاء</button>
   </div>`);

 const textarea=document.getElementById('bulkStudentNames');
 const saveBtn=document.getElementById('saveBulkStudents');
 const resultBox=document.getElementById('bulkAddResult');

 document.getElementById('closeBulkStudents').onclick=closeModal;
 setTimeout(()=>textarea.focus(),50);

 saveBtn.onclick=()=>{
   const names=textarea.value
     .split(/[\n،,;]+/)
     .map(name=>name.trim().replace(/\s+/g,' '))
     .filter(Boolean);

   if(!names.length){
     alert('اكتب اسم طالب واحد على الأقل');
     return;
   }

   const normalize=name=>name.toLocaleLowerCase('ar').replace(/\s+/g,' ').trim();
   const existing=new Set(
     data.students
       .filter(s=>s.classId===c.id)
       .map(s=>normalize(s.name))
   );

   const unique=[];
   const skipped=[];
   names.forEach(name=>{
     const key=normalize(name);
     if(existing.has(key) || unique.some(x=>normalize(x)===key)){
       skipped.push(name);
     }else{
       unique.push(name);
     }
   });

   if(!unique.length){
     resultBox.style.display='block';
     resultBox.textContent='لم تتم إضافة أسماء جديدة؛ جميع الأسماء موجودة مسبقًا أو مكررة.';
     return;
   }

   const addedIds=[];
   unique.forEach(name=>{
     const student={
       id:crypto.randomUUID(),
       classId:c.id,
       name,
       phone:'',
       note:'',
       photo:''
     };
     data.students.push(student);
     addedIds.push(student.id);
   });

   if(!save()){
     data.students=data.students.filter(s=>!addedIds.includes(s.id));
     return;
   }

   closeModal();
   render();
   toast(`تمت إضافة ${unique.length} طالب${skipped.length?` وتجاهل ${skipped.length} اسم مكرر`:''}`);
 };
}

function renderActivityPlay(activityId){
 const activity=data.activities.find(a=>a.id===activityId);
 if(!activity){page='activities';render();return}
 const baseQuestions=activity.questions||[];
 const order=activity.shuffle?[...baseQuestions].sort(()=>Math.random()-.5):[...baseQuestions];
 const activityStudents=getActivityStudents(activity);
 const state={index:0,questions:order,remaining:activityStudents.map(s=>s.id),selectedStudentId:null,correctCount:0,pointsAwarded:0,studentPoints:{},revealed:false,finished:false};
 const draw=()=>{
  if(state.finished){
   const topId=Object.entries(state.studentPoints).sort((a,b)=>b[1]-a[1])[0]?.[0];
   const top=data.students.find(s=>s.id===topId);
   view.innerHTML=`<div class="activity-summary"><h2>🎉 انتهى النشاط</h2><p>${escapeHtml(activity.title)}</p><div class="summary-stat-grid"><div class="summary-stat">الأسئلة<b>${state.questions.length}</b></div><div class="summary-stat">الصحيحة<b>${state.correctCount}</b></div><div class="summary-stat">النقاط<b>${state.pointsAwarded}</b></div></div>${top?`<p>🏆 الأكثر حصولًا على النقاط: <b>${top.name}</b></p>`:''}<button class="btn" id="finishActivity" style="background:#fff;color:#17324d">العودة إلى الأنشطة</button></div>`;
   finishActivity.onclick=()=>{page='activities';render()};return
  }
  const q=state.questions[state.index];
  const selected=data.students.find(s=>s.id===state.selectedStudentId);
  const progress=Math.round((state.index+1)/state.questions.length*100);
  setTitle(activity.title,`${state.index+1} من ${state.questions.length}`);
  view.innerHTML=`<div class="play-shell"><div class="play-top"><button class="btn light" id="exitPlay">خروج</button><b>${escapeHtml(activity.title)}</b></div><div class="play-progress"><div style="width:${progress}%"></div></div><div class="student-picker-card"><div class="picker-placeholder">الطالب المختار لهذا السؤال</div><div class="picked-student">${selected?selected.name:'لم يتم الاختيار بعد'}</div><button class="btn secondary" id="pickStudent">🎲 اختيار طالب عشوائي</button></div><div class="question-stage"><div class="question-number">السؤال ${state.index+1}</div><div class="question-text">${escapeHtml(q.text)}</div><div class="play-options">${q.options.map((o,i)=>`<button class="play-option ${state.revealed?(i===q.correct?'reveal-correct':'reveal-wrong'):''}" ${state.revealed?'disabled':''}>${String.fromCharCode(65+i)} — ${escapeHtml(o)}</button>`).join('')}</div></div><div class="play-controls"><button class="btn light" id="revealAnswer">${state.revealed?'تم إظهار الإجابة':'إظهار الإجابة الصحيحة'}</button><button class="btn secondary" id="manualStudent">👆 اختيار يدوي</button></div><div class="play-result-controls"><button class="btn danger" id="markWrong" ${selected?'':'disabled'}>✕ غير صحيحة</button><button class="btn" id="markCorrect" ${selected?'':'disabled'}>✓ صحيحة +${q.points}</button></div><button class="btn play-next" id="nextQuestion">${state.index===state.questions.length-1?'إنهاء النشاط':'التالي ←'}</button></div>`;
  exitPlay.onclick=()=>{if(confirm('هل تريد الخروج من النشاط؟')){page='activities';render()}};
  pickStudent.onclick=()=>{
   if(!activityStudents.length){alert('لا يوجد طلاب في الفصل المرتبط بالنشاط');return}
   if(!state.remaining.length){state.remaining=activityStudents.map(s=>s.id);toast('بدأت دورة اختيار جديدة')}
   const idx=Math.floor(Math.random()*state.remaining.length);
   state.selectedStudentId=state.remaining.splice(idx,1)[0];
   draw();
  };
  manualStudent.onclick=()=>{
   openModal(`<h2>اختيار طالب</h2><div class="student-action-menu">${activityStudents.map(s=>`<button class="student-action-item" data-manual-student="${s.id}"><span class="menu-icon">👨‍🎓</span><div>${s.name}</div></button>`).join('')}</div><button class="btn light" id="closeM" style="margin-top:10px">إغلاق</button>`);
   document.querySelectorAll('[data-manual-student]').forEach(b=>b.onclick=()=>{state.selectedStudentId=b.dataset.manualStudent;closeModal();draw()});
   closeM.onclick=closeModal
  };
  revealAnswer.onclick=()=>{state.revealed=true;draw()};
  markCorrect.onclick=()=>{
   if(!state.selectedStudentId)return;
   data.logs.push({id:crypto.randomUUID(),studentId:state.selectedStudentId,name:`إجابة صحيحة: ${activity.title}`,value:q.points,task:false,date:new Date().toISOString()});
   state.correctCount++;state.pointsAwarded+=q.points;
   state.studentPoints[state.selectedStudentId]=(state.studentPoints[state.selectedStudentId]||0)+q.points;
   save();toast(`تمت إضافة ${q.points} نقطة`);state.revealed=true;draw()
  };
  markWrong.onclick=()=>{state.revealed=true;toast('تم تسجيل الإجابة دون إضافة نقاط');draw()};
  nextQuestion.onclick=()=>{if(state.index>=state.questions.length-1)state.finished=true;else{state.index++;state.selectedStudentId=null;state.revealed=false}draw()};
 };
 draw();
}

function examDraftKey(classId){return `rasdExamDraft:${classId}`}
function loadExamDraft(classId){
 try{return JSON.parse(localStorage.getItem(examDraftKey(classId))||'null')}
 catch(e){return null}
}
function saveExamDraft(classId,draft){
 localStorage.setItem(examDraftKey(classId),JSON.stringify(draft))
}
function clearExamDraft(classId){
 localStorage.removeItem(examDraftKey(classId))
}
function examCellValue(record,key){
 const value=record?.[key];
 return value===undefined||value===null?'':String(value)
}
function buildExamDraft(classId){
 const draft={classId,updatedAt:new Date().toISOString(),students:{}};
 data.students.filter(s=>s.classId===classId).forEach(s=>{
  const e=data.exams[s.id]||{};
  draft.students[s.id]={p1:examCellValue(e,'p1'),p2:examCellValue(e,'p2'),final:examCellValue(e,'final')}
 });
 return draft
}
function renderExams(){
 let classId=data.selectedClass||data.classes[0]?.id||null;
 const c=data.classes.find(x=>x.id===classId);
 setTitle('الاختبارات',c?c.name:'اختر فصلاً');

 if(!data.classes.length){
  view.innerHTML='<div class="notice">أضف فصلاً أولاً من شاشة الفصول</div>';
  return;
 }

 if(!classId){
  classId=data.classes[0].id;
  data.selectedClass=classId;
 }

 const classStudents=data.students
  .filter(s=>s.classId===classId)
  .sort((a,b)=>a.name.localeCompare(b.name,'ar'));

 let draft=loadExamDraft(classId);
 const hasDraft=!!draft;
 if(!draft)draft=buildExamDraft(classId);

 const rows=classStudents.map(s=>{
  const d=draft.students?.[s.id]||{p1:'',p2:'',final:''};

  return `<tr>

    <td><input class="exam-score ${modified('p2')?'modified':''}" inputmode="decimal" type="number" min="0" max="20" data-s="${s.id}" data-k="p2" value="${d.p2??''}"></td>
    <td><input class="exam-score ${modified('final')?'modified':''}" inputmode="decimal" type="number" min="0" max="40" data-s="${s.id}" data-k="final" value="${d.final??''}"></td>

 }).join('');

 view.innerHTML=`<div class="exam-page">

     <div class="field">
       <label>الفصل</label>
       <select id="examClassSelect">
         ${data.classes.map(x=>`<option value="${x.id}" ${x.id===classId?'selected':''}>${x.name}</option>`).join('')}
       </select>
     </div>
     <div class="students-count">${classStudents.length} طالب</div>
   </div>

   <div id="examDraftStatus" class="exam-draft-status ${hasDraft?'dirty':'clean'}">
     ${hasDraft?'🟡 توجد درجات محفوظة كمسودة وغير معتمدة':'✅ لا توجد تعديلات غير معتمدة'}
   </div>

   ${classStudents.length?`
   <div class="exam-table-wrap">
     <table class="exam-table">
       <thead><tr><th>الطالب</th><th>الفتري الأول /20</th><th>الفتري الثاني /20</th><th>نهاية الفصل /40</th></tr></thead>
       <tbody>${rows}</tbody>
     </table>
   </div>
   <div class="exam-save-note">تُحفظ كل درجة تلقائيًا كمسودة على الجهاز، ولا تظهر في التقارير إلا بعد اعتماد الدرجات.</div>
   `:'<div class="notice">لا يوجد طلاب في هذا الفصل</div>'}

   <div class="exam-actions-bar">
     <button class="btn light" id="discardExamDraft" ${hasDraft?'':'disabled'}>إلغاء المسودة</button>
     <button class="btn" id="approveExamGrades" ${classStudents.length?'':'disabled'}>✓ اعتماد الدرجات</button>
   </div>
 </div>`;

 const classSelect=document.getElementById('examClassSelect');
 classSelect.onchange=()=>{
  data.selectedClass=classSelect.value;
  save();
  renderExams();
 };

 const inputs=[...document.querySelectorAll('.exam-score')];
 const status=document.getElementById('examDraftStatus');
 const discardBtn=document.getElementById('discardExamDraft');

 function persistDraft(){
  draft.updatedAt=new Date().toISOString();
  saveExamDraft(classId,draft);
  status.className='exam-draft-status dirty';
  status.textContent='🟡 توجد درجات محفوظة كمسودة وغير معتمدة';
  discardBtn.disabled=false;
 }

 inputs.forEach(input=>{
  input.addEventListener('input',()=>{
   const max=Number(input.max);
   const raw=input.value.trim();
   const numeric=raw===''?null:Number(raw);
   const invalid=numeric!==null&&(!Number.isFinite(numeric)||numeric<0||numeric>max);
   input.classList.toggle('invalid',invalid);

   draft.students[input.dataset.s]=draft.students[input.dataset.s]||{p1:'',p2:'',final:''};
   draft.students[input.dataset.s][input.dataset.k]=raw;
   const saved=data.exams[input.dataset.s]||{};
   input.classList.toggle('modified',raw!==examCellValue(saved,input.dataset.k));
   persistDraft();
  });
 });

 discardBtn.onclick=()=>{
  if(!confirm('هل تريد حذف المسودة والعودة إلى آخر درجات معتمدة؟'))return;
  clearExamDraft(classId);
  toast('تم حذف المسودة');
  renderExams();
 };

 document.getElementById('approveExamGrades').onclick=()=>{
  const invalidInputs=inputs.filter(input=>{
   const raw=input.value.trim();
   if(raw==='')return false;
   const value=Number(raw);
   return !Number.isFinite(value)||value<0||value>Number(input.max);
  });

  if(invalidInputs.length){
   invalidInputs.forEach(i=>i.classList.add('invalid'));
   invalidInputs[0].focus();
   alert('يوجد درجات غير صحيحة أو أكبر من الدرجة العظمى.');
   return;
  }

  classStudents.forEach(s=>{
   const d=draft.students[s.id]||{};
   const e=data.exams[s.id]=data.exams[s.id]||{};

   ['p1','p2','final'].forEach(k=>{
    const raw=String(d[k]??'').trim();
    if(raw==='')delete e[k];
    else e[k]=Number(raw);
   });

   const periodicValues=['p1','p2']
    .filter(k=>e[k]!==undefined&&e[k]!==null)
    .map(k=>Number(e[k]));
   if(periodicValues.length){
    const total=periodicValues.reduce((a,b)=>a+b,0);
    const max=periodicValues.length*20;
    e.periodicScore=Math.round(total/max*100);
   }else{
    delete e.periodicScore;
   }

   if(e.final!==undefined&&e.final!==null){
    e.finalScore=Math.round(Number(e.final)/40*100);
   }else{
    delete e.finalScore;
   }
  });

  if(!save())return;
  clearExamDraft(classId);
  toast('تم حفظ واعتماد درجات الفصل بنجاح');
  renderExams();
 };
}

const LEVEL_DEFINITIONS=[
 {level:1,min:0,max:9,title:'مبتدئ',icon:'🌱'},
 {level:2,min:10,max:24,title:'مجتهد',icon:'⭐'},
 {level:3,min:25,max:49,title:'متقدم',icon:'🥉'},
 {level:4,min:50,max:79,title:'متميز',icon:'🥈'},
 {level:5,min:80,max:119,title:'نجم',icon:'🥇'},
 {level:6,min:120,max:Infinity,title:'أسطورة الفصل',icon:'👑'}
];

function getStudentLevel(studentId){
 const points=totalPoints(studentId);
 const current=LEVEL_DEFINITIONS.find(l=>points>=l.min&&points<=l.max)||LEVEL_DEFINITIONS[0];
 const next=LEVEL_DEFINITIONS.find(l=>l.level===current.level+1);
 const rangeMax=Number.isFinite(current.max)?current.max:current.min+40;
 const progress=next
   ?Math.max(0,Math.min(100,Math.round((points-current.min)/(next.min-current.min)*100)))
   :100;
 const remaining=next?Math.max(0,next.min-points):0;
 return {...current,points,next,progress,remaining};
}

function levelHtml(studentId,{compact=false}={}){

 return `<div class="${compact?'live-level-row':''}">

   <div class="level-progress-wrap">

     </div>
     <div class="level-progress-track"><div class="level-progress-fill" style="width:${info.progress}%"></div></div>
     <div class="level-message">${info.next?`تبقى ${info.remaining} نقاط للوصول إلى المستوى ${info.next.level}`:'وصل إلى أعلى مستوى 🎉'}</div>
   </div>
 </div>`;
}

function checkLevelUp(studentId,{show=true}={}){
 const student=data.students.find(s=>s.id===studentId);
 if(!student)return null;
 const info=getStudentLevel(studentId);
 const oldLevel=student.levelUnlocked||1;
 if(info.level>oldLevel){
   student.levelUnlocked=info.level;
   save();
   if(show)showLevelUp(student,info);
   return info;
 }
 if(!student.levelUnlocked){
   student.levelUnlocked=info.level;
   save();
 }
 return null;
}

 document.getElementById('waReport').onclick=()=>{
   let phone=(s.phone||'').replace(/\D/g,'');
   if(!phone){alert('لم يتم إضافة رقم ولي الأمر لهذا الطالب');return}
   if(phone.startsWith('05'))phone='966'+phone.slice(1);
   const msg=`السلام عليكم، نشارككم تقرير الطالب ${s.name}. مستوى الأداء الحالي ${score}%، وعدد النقاط ${totalPoints(id)}، والغياب ${abs}، والتأخر ${late}.`;
   window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank');
 };
}
